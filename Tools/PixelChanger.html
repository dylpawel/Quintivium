<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Pixel Swapper</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #ececec; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { background: #333; padding: 15px 25px; border-radius: 50px; display: flex; gap: 20px; align-items: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .workspace { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px; }
        
        /* The Zoom Magic */
        #canvas-wrapper { 
            border: 3px solid #444; 
            background-color: #222;
            background-image: linear-gradient(45deg, #2b2b2b 25%, transparent 25%), linear-gradient(-45deg, #2b2b2b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2b2b2b 75%), linear-gradient(-45deg, transparent 75%, #2b2b2b 75%);
            background-size: 20px 20px;
            overflow: auto; 
            max-height: 80vh;
        }
        canvas { image-rendering: pixelated; display: block; cursor: crosshair; }
        
        #palette-sidebar { background: #262626; padding: 20px; border-radius: 12px; min-width: 280px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .color-entry { display: flex; align-items: center; margin-bottom: 12px; background: #333; padding: 8px; border-radius: 6px; transition: transform 0.1s; }
        .color-entry:hover { transform: translateX(5px); }
        .swatch { width: 35px; height: 35px; border-radius: 4px; border: 2px solid #555; margin-right: 15px; }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; }
        .count-label { font-size: 0.85rem; color: #aaa; margin-left: auto; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="fileInput" accept="image/*">
        <label>Zoom: 
            <select id="zoom">
                <option value="1">1x (Native)</option>
                <option value="2">2x Zoom</option>
                <option value="3">3x Zoom</option>
                <option value="4" selected>4x Zoom</option>
            </select>
        </label>
    </div>

    <div class="workspace">
        <div id="canvas-wrapper">
            <canvas id="editorCanvas"></canvas>
        </div>

        <div id="palette-sidebar">
            <h3 style="margin-top:0">Top 10 Pixels</h3>
            <div id="paletteContainer">Upload an image...</div>
        </div>
    </div>

<script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const paletteContainer = document.getElementById('paletteContainer');
    const zoomSelect = document.getElementById('zoom');

    let currentImageData = null;

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const img = new Image();
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            renderUI();
        };
        img.src = URL.createObjectURL(file);
    };

    zoomSelect.onchange = applyZoom;

    function applyZoom() {
        const z = zoomSelect.value;
        canvas.style.transformOrigin = "top left";
        canvas.style.width = (canvas.width * z) + "px";
        canvas.style.height = (canvas.height * z) + "px";
    }

    function renderUI() {
        applyZoom();
        const colors = getTopColors(currentImageData.data);
        paletteContainer.innerHTML = '';

        colors.forEach(item => {
            const row = document.createElement('div');
            row.className = 'color-entry';

            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.backgroundColor = item.rgb;

            const picker = document.createElement('input');
            picker.type = 'color';
            picker.value = rgbToHex(item.r, item.g, item.b);
            
            // LIVE UPDATE: Listen to the 'input' event for real-time changes
            picker.oninput = (e) => {
                const newHex = e.target.value;
                swatch.style.backgroundColor = newHex;
                swapPixels(item.r, item.g, item.b, newHex);
                // Update the stored values so the next change knows the "new" color is the target
                item.r = parseInt(newHex.slice(1, 3), 16);
                item.g = parseInt(newHex.slice(3, 5), 16);
                item.b = parseInt(newHex.slice(5, 7), 16);
            };

            row.appendChild(swatch);
            row.appendChild(picker);
            row.innerHTML += `<span class="count-label">${item.count} pixels</span>`;
            // Re-append the picker because innerHTML wipes listeners
            row.replaceChild(picker, row.querySelectorAll('input')[0]);
            row.replaceChild(swatch, row.querySelectorAll('.swatch')[0]);
            
            paletteContainer.appendChild(row);
        });
    }

    function swapPixels(oldR, oldG, oldB, newHex) {
        const newRGB = hexToRgb(newHex);
        const data = currentImageData.data;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i] === oldR && data[i+1] === oldG && data[i+2] === oldB) {
                data[i] = newRGB.r;
                data[i+1] = newRGB.g;
                data[i+2] = newRGB.b;
            }
        }
        ctx.putImageData(currentImageData, 0, 0);
    }

    function getTopColors(data) {
        const counts = {};
        for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] < 128) continue; // Ignore transparent
            const key = `${data[i]},${data[i+1]},${data[i+2]}`;
            counts[key] = (counts[key] || 0) + 1;
        }
        return Object.entries(counts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10)
            .map(([rgb, count]) => {
                const [r, g, b] = rgb.split(',').map(Number);
                return { r, g, b, rgb: `rgb(${rgb})`, count };
            });
    }

    function rgbToHex(r, g, b) {
        return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function hexToRgb(hex) {
        const bigint = parseInt(hex.slice(1), 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }
</script>
</body>
</html>
